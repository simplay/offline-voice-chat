[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-voice-chat"
version = "0.1.0"
description = "An extensible local voice chatbot with memory and barge-in"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.3.35,<0.4",
    "moonshine-voice>=0.1.5,<0.2",
    "numpy>=1.26,<3",
    "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
realtime = [
    "websocket-client>=1.8,<2",
]
setup = [
    "huggingface-hub>=0.34,<2",
]
dev = [
    "numpy>=1.26,<3",
    "ruff>=0.11,<1",
]

[project.scripts]
offline-voice-chat = "offline_voice_chat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
